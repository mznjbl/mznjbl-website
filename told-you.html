<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Told You — MZNJBL/</title>
    <meta name="theme-color" content="#0b0d0c" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap");

      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100svh;
        background: #0b0d0c;
        color: #f1f2ed;
        font-family: "IBM Plex Mono", monospace;
      }

      .joke-page {
        position: relative;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 110px 24px;
      }

      .top-back {
        position: absolute;
        top: clamp(25px, 4vw, 55px);
        left: clamp(24px, 4vw, 64px);
        color: #f1f2ed;
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 0.05em;
        transition: color 0.2s ease;
      }

      .top-back:hover,
      .top-back:focus-visible {
        color: #d7ff35;
      }

      .center {
        width: 100%;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: "Archivo Black", sans-serif;
        font-size: clamp(52px, 10vw, 160px);
        line-height: 0.95;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .told {
        color: #d7ff35;
      }

      .escape {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 36px;
        margin-top: 55px;
        padding: 20px 28px;
        background: #d7ff35;
        color: #0b0d0c;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .escape:hover,
      .escape:focus-visible {
        background: #f1f2ed;
        transform: translateY(-3px);
      }

      a:focus-visible {
        outline: 2px solid #d7ff35;
        outline-offset: 5px;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none !important;
        }
      }

      /* Desktop heading spacing fix */
      @media (min-width: 768px) {
        h1.told {
          letter-spacing: -0.025em;
          font-size: clamp(52px, 9vw, 145px);
          line-height: 1.08;
        }
      }
    </style>
  </head>

  <body>
    <main class="joke-page">
      <div class="center">
        <h1 class="told">TOLD YOU.</h1>

        <a class="escape" href="/">
          GO BACK TO STUDIO <span aria-hidden="true">↗</span>
        </a>
      </div>
    </main>
  </body>
</html>
